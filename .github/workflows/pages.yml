name: Documentation
on:
  push:
    branches: [main]
    paths: ['docs/**', 'scripts/check-docs.py', '.github/workflows/pages.yml']
  pull_request:
    paths: ['docs/**', 'scripts/check-docs.py', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: docs
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - name: Build documentation
        working-directory: docs
        env:
          JEKYLL_ENV: production
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: bundle exec jekyll build --baseurl "$SITE_BASE_PATH" --destination ../.context/site
      - name: Check documentation links
        env:
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: python3 scripts/check-docs.py .context/site --baseurl "$SITE_BASE_PATH"
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: .context/site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
